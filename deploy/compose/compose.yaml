name: knowvault

# One-compose install for a customer deployment (anti-SAP: one file, one
# bootstrap, README.md fits on one screen). Every image is pinned by exact
# digest (no tag alone ever selects a runtime — PRODUCT_CONSTITUTION.md §8,
# POKA_YOKE.md LIC-004). `deploy/compose/bootstrap.sh` provisions PKI,
# secrets, database roles/migrations, the first organization/OWNER and the
# Keycloak realm before this file's `server`/`worker`/`proxy` are started;
# see deploy/compose/README.md for the exact three commands.
#
# GPU is not required and none of these services request one: the embedding
# service below is the CPU-only multilingual retrieval/verification channel
# (ADR-0080 §2.4, ADR-0088 GEN-2 addendum) — see the `embedding`/`embedding-
# proxy` services and deploy/compose/README.md for its interim-qualification
# caveat (a real offline model, not the trigram fallback verifier, but not
# yet the full ADR-0080 §3 qualification matrix).

services:
  postgres:
    image: postgres:18.4@sha256:b913fd5699b8bd23fa4b06d72ecdd939fad43b80fb8651bac06caa0e6d135cac
    container_name: knowvault-postgres
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_DB: knowvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KNOWVAULT_POSTGRES_PASSWORD:?set in deploy/compose/.env}
      KNOWVAULT_KEYCLOAK_DB_PASSWORD: ${KNOWVAULT_KEYCLOAK_DB_PASSWORD:?set in deploy/compose/.env}
    entrypoint:
      - bash
      - -c
      - >-
        set -e;
        install -o postgres -g postgres -m 0600 /run/knowvault-pki/pg.key /run/pg.key;
        install -o postgres -g postgres -m 0644 /run/knowvault-pki/pg.crt /run/pg.crt;
        exec /usr/local/bin/docker-entrypoint.sh postgres
        -c ssl=on -c ssl_cert_file=/run/pg.crt -c ssl_key_file=/run/pg.key
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knowvault-pgdata:/var/lib/postgresql
      - ./pki/platform/postgres.key:/run/knowvault-pki/pg.key:ro
      - ./pki/platform/postgres.crt:/run/knowvault-pki/pg.crt:ro
      - ./postgres-init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak-db.sh:ro
    networks:
      default:
        aliases: [knowvault-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowvault"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  opensearch:
    image: opensearchproject/opensearch:3.7.0@sha256:123e6591a47b1d54686890551bdb35739c85193ecded381219fc9e059e18128f
    container_name: knowvault-opensearch
    restart: unless-stopped
    mem_limit: 1200m
    cpus: 1.5
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - knowvault-osdata:/usr/share/opensearch/data
      - ./pki/search/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./pki/search/node.crt:/usr/share/opensearch/config/knowvault-node.crt:ro
      - ./pki/search/node.key:/usr/share/opensearch/config/knowvault-node.key:ro
      - ./pki/search/ca.crt:/usr/share/opensearch/config/knowvault-search-ca.crt:ro
      - ./pki/search/client.crt:/usr/share/opensearch/config/knowvault-admin.crt:ro
      - ./pki/search/client.key:/usr/share/opensearch/config/knowvault-admin.key:ro
    networks:
      default:
        aliases: [knowvault-search]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -skf --cacert /usr/share/opensearch/config/knowvault-search-ca.crt
          --cert /usr/share/opensearch/config/knowvault-admin.crt
          --key /usr/share/opensearch/config/knowvault-admin.key
          https://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  # Isolated CPU embedding runtime behind the existing embedding mTLS channel
  # (internal/embedding). Multilingual, small enough for CPU (intfloat/
  # multilingual-e5-small, 384-dim). Pinned by exact digest (no tag alone
  # selects a runtime). The model is cached in the named volume below: only
  # the very first start needs network access to fetch it from the Hugging
  # Face hub; every later start (and every request) is served from that
  # cache, and a fully egress-denied network still works once the volume is
  # warm. See deploy/compose/README.md for this activation's explicit
  # interim-qualification scope. embedding-proxy terminates the mTLS the
  # server/worker mount expects — text-embeddings-inference has no built-in
  # client-certificate authentication.
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6@sha256:66db77d7856c9319bbfaf2c5b80a6d0e0ac9ff128ade09eaca1d9c20213617a4
    # The container name must not collide with the mTLS proxy's network alias
    # below: Docker resolves container names AND aliases on the same network,
    # so naming this container `knowvault-embedding` made that name resolve to
    # two addresses. Roughly every second embedding request went to this
    # plain-HTTP runtime on port 443 and was refused, which the indexer
    # correctly refused to treat as a partial success. Only the proxy answers
    # to `knowvault-embedding`; the runtime is reachable exclusively as
    # `knowvault-embedding-backend`, on plain HTTP, from the proxy.
    container_name: knowvault-embedding-runtime
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    # --auto-truncate: the model's context is 512 tokens and a knowledge
    # corpus legitimately contains passages longer than that (code files, long
    # document sections). Without it the runtime answers 413 for those
    # passages, which the indexer correctly refuses to treat as a partial
    # success -- it stops instead, and the corpus can never finish indexing.
    # Truncation is a property of the retrieval vector only: the passage is
    # still stored, still cited and still disclosed in full from PostgreSQL,
    # and it is still found by the lexical channel over its whole text. It is
    # part of this profile's identity (profile_hash covers the runtime), so a
    # deployment cannot change it without a new profile revision.
    command: ["--model-id", "intfloat/multilingual-e5-small", "--port", "80", "--auto-truncate"]
    volumes:
      - knowvault-embedding-cache:/data
    networks:
      default:
        aliases: [knowvault-embedding-backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  embedding-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: knowvault-embedding-proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes:
      - ./proxy/embedding.conf:/etc/nginx/nginx.conf:ro
      - ./pki/embedding/server.crt:/etc/nginx/tls/server.crt:ro
      - ./pki/embedding/server.key:/etc/nginx/tls/server.key:ro
      - ./pki/embedding/ca.crt:/etc/nginx/tls/client-ca.crt:ro
    depends_on:
      embedding:
        condition: service_healthy
    networks:
      default:
        aliases: [knowvault-embedding]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3@sha256:6a7217a100bd3e5de4063a27a538ef999a3c5a88c4b4ec0ffc0a642aee7b2597
    container_name: knowvault-keycloak
    restart: unless-stopped
    mem_limit: 900m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: kv-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KNOWVAULT_KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://knowvault-postgres:5432/keycloak?sslmode=require
      KC_DB_USERNAME: knowvault_keycloak
      KC_DB_PASSWORD: ${KNOWVAULT_KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
      KC_RUN_IN_CONTAINER: "true"
    command:
      - start
      - --http-enabled=false
      - --https-port=8443
      - --hostname=https://knowvault-idp.local:8443
      - --hostname-strict=false
      - --https-certificate-file=/opt/keycloak/conf/server.crt
      - --https-certificate-key-file=/opt/keycloak/conf/server.key
      - --import-realm
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - knowvault-keycloak-data:/opt/keycloak/data
      - ./pki/keycloak/server.crt:/opt/keycloak/conf/server.crt:ro
      - ./pki/keycloak/server.key:/opt/keycloak/conf/server.key:ro
      - ./keycloak/knowvault-realm.json:/opt/keycloak/data/import/knowvault-realm.json:ro
    networks:
      default:
        aliases: [knowvault-idp, knowvault-idp.local]

  server:
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.server
    container_name: knowvault-server
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    tmpfs: [/tmp]
    environment:
      KNOWVAULT_ORGANIZATION_ID: ${KNOWVAULT_ORGANIZATION_ID:?set in .env}
      KNOWVAULT_PROVIDER_ID: keycloak-main
      KNOWVAULT_PUBLIC_ORIGIN: https://knowvault.local:8480
      KNOWVAULT_HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./mounts/server/secrets:/run/knowvault/secrets:ro
      - ./mounts/server/trust:/run/knowvault/trust:ro
      - ./mounts/server/search:/run/knowvault/search:ro
      - ./mounts/server/embedding:/run/knowvault/embedding:ro
    networks:
      default:
        aliases: [knowvault-server]
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      embedding-proxy:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: deploy/images/Dockerfile.worker
    container_name: knowvault-worker
    restart: unless-stopped
    read_only: true
    user: "65530:65530"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    environment:
      KNOWVAULT_ORGANIZATION_ID: ${KNOWVAULT_ORGANIZATION_ID:?set in .env}
      KNOWVAULT_PROVIDER_ID: keycloak-main
      KNOWVAULT_WORKER_ID: worker-1
      KNOWVAULT_WORKER_LEASE_SECONDS: "60"
      KNOWVAULT_WORKER_POLL_SECONDS: "5"
    volumes:
      - ./mounts/worker/secrets:/run/knowvault/secrets:ro
      - ./mounts/worker/trust:/run/knowvault/trust:ro
      - ./mounts/worker/source-trust:/run/knowvault/source-trust:ro
      - ./mounts/worker/source:/run/knowvault/sources:ro
      - ./mounts/worker/search:/run/knowvault/search:ro
      - ./mounts/worker/embedding:/run/knowvault/embedding:ro
    networks:
      default:
        aliases: [knowvault-worker]
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      embedding-proxy:
        condition: service_started

  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: knowvault-proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    ports:
      - "127.0.0.1:8480:8480"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./pki/proxy/server.crt:/etc/nginx/tls/server.crt:ro
      - ./pki/proxy/server.key:/etc/nginx/tls/server.key:ro
    depends_on: [server]
    networks:
      default:
        aliases: [knowvault.local]

volumes:
  knowvault-pgdata:
    name: knowvault-pgdata
  knowvault-osdata:
    name: knowvault-osdata
  knowvault-keycloak-data:
    name: knowvault-keycloak-data
  knowvault-embedding-cache:
    name: knowvault-embedding-cache

networks:
  default:
    name: knowvault-net
