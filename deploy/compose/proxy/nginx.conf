events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8480 ssl;
    server_name knowvault.local;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $knowvault_server knowvault-server;
    location / {
      proxy_pass http://$knowvault_server:8080$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # R3: must stay above knowvault-server's http.Server.WriteTimeout
      # (internal/platform/composition/runtime.go httpWriteTimeout, 280s),
      # which itself must stay above modelgateway.MaxToolLoopTimeoutSeconds
      # with margin, or a question that spends its full configured budget can
      # have this proxy -- or the Go server -- close the connection before the
      # terminal frame is written.
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
