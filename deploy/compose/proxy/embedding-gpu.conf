events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server {
    listen 443 ssl;
    server_name knowvault-embedding;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_client_certificate /etc/nginx/tls/client-ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The GPU variant of proxy/embedding.conf. The channel the server and the
    # worker speak is unchanged: the same mTLS, the same `knowvault-embedding`
    # name, the same https endpoint the embedding profile declares. Only the
    # upstream moves off the in-compose CPU runtime onto a model runtime that
    # lives outside this compose file.
    #
    # That indirection is the point. The profile contract admits no IP literal
    # and no plaintext endpoint, and it does not need to: the deployment's own
    # proxy IS the endpoint, and what answers behind it is a deployment
    # decision rather than a property of the product.
    #
    # The upstream is a name, not an address, and the address is supplied by
    # the overlay (compose.embedding-gpu.yaml) as an extra_hosts entry. A
    # committed address would make one deployment's topology part of the
    # product; a name keeps the same file correct on every stand.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $knowvault_embedding_backend knowvault-embedding-upstream:8087;

    location / {
      proxy_pass http://$knowvault_embedding_backend$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # A GPU runtime batches, and the first request after a model load is far
      # slower than a warm one. The read budget is larger than the CPU
      # variant's so a slow first embedding is a slow answer rather than a
      # failed indexing pass that looks like a broken model.
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
