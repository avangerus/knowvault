events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server {
    listen 443 ssl;
    server_name knowvault-embedding;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_client_certificate /etc/nginx/tls/client-ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Docker's embedded DNS, re-resolved at request time. An 'upstream' block
    # (or a literal proxy_pass host) is resolved once at start, so recreating
    # the embedding runtime container behind this proxy left the proxy
    # answering 502 to every embedding request until it was restarted too --
    # an outage that looked exactly like a model failure. Resolving through a
    # variable keeps the channel correct across container lifecycles.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $knowvault_embedding_backend knowvault-embedding-backend;
    location / {
      proxy_pass http://$knowvault_embedding_backend:80$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }
  }
}
