version: 2
default: deny
legal_review_required_for_changes: true
version_lock: architecture/versions.json

scope_policy:
  application_dependency:
    default: deny
    rule: only allowlisted permissive licenses; copyleft-linked libraries require an accepted ADR and legal approval
  shipped_oci_package:
    default: deny
    rule: every package in the image SBOM must have a concluded license; standalone GPL/LGPL OS packages require source-compliance evidence and legal approval
  build_only_tool:
    default: deny
    rule: license must be recorded even when the tool is absent from production; copyleft tools require legal review before distributing the build image
  model_artifact:
    default: deny
    rule: exact revision, weight hash, license text and AIBOM entry are mandatory

allow:
  - Apache-2.0
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - PostgreSQL
  - PSF-2.0
  - ISC
  - LicenseRef-IANA-TZ-Public-Domain

conditional_allow:
  - expression: Artistic-2.0
    scope: npm CLI bundled in the exact build-only Node image and prohibited as the project package manager
    requires: ADR-0009-exact-builder-digest-sbom-and-no-production-copy
  - expression: GPL-2.0-only WITH Classpath-exception-2.0
    scope: pinned, jlink-stripped OpenJDK runtime used only by the isolated document-parser worker (Apache POI/PDFBox), ADR-0066 composed with ADR-0062
    requires: accepted-license-adr-and-third-party-notice
  - expression: MPL-2.0
    scope: file-level copyleft dependency with no product-source modification
    requires: explicit-legal-approval
  - expression: GPL-or-LGPL-standalone-oci-package
    scope: unmodified standalone operating-system package that is not linked into KnowVault
    requires: explicit-legal-approval-source-offer-and-third-party-notice

deny:
  - AGPL-1.0-only
  - AGPL-1.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - SSPL-1.0
  - BUSL-1.1
  - Elastic-2.0
  - Commons-Clause
  - PolyForm-Noncommercial-1.0.0
  - unknown
  - custom-noncommercial
  - research-only

