explicitly_not_selected:
  - name: MinIO
    reason: AGPL and no required object-storage role in 1.0
  - name: HashiCorp Vault
    reason: BSL; use customer-provided secret/KMS integration
  - name: Grafana
    reason: AGPL; export metrics to customer monitoring stack
  - name: Prometheus
    reason: only protocol-compatible metrics export is planned; no Prometheus binary or library is shipped in 1.0
  - name: Redis
    reason: no cache or separate queue is required in 1.0
  - name: Qdrant
    reason: OpenSearch already owns lexical and vector retrieval
  - name: Temporal
    reason: PostgreSQL leases and outbox are sufficient for 1.0

release_artifacts:
  required:
    - sbom.spdx.json per container
    - aibom.json with model id, exact revision, weight hash, license
    - THIRD_PARTY_NOTICES.md
    - image-lock.json with immutable digests
    - package-level concluded licenses for every OCI layer
    - source/compliance bundle for every conditionally allowed copyleft package
  forbidden:
    - latest tags
    - unpinned git dependencies
    - runtime model downloads
    - dependency with missing license metadata
    - CA certificates and trust bundles supplied as KnowVault release artifacts

container_rules:
  - top-level project license never substitutes for package-level OCI SBOM review
  - development and production image references both require tag plus digest
  - multiarch index digest is the architecture lock; each offline release additionally records selected platform manifest and layer blob digests
  - build images are inventoried even though they are absent from production
  - scratch application images remain subject to SBOM for the binary; KnowVault images and build contexts must not contain a CA bundle
  - database-ca.pem and oidc-ca.pem are customer-supplied external runtime artifacts, are never shipped by KnowVault, and remain the customer's licensing responsibility
  - deferred Tika, PaddleOCR and vLLM images block release until exact digest and transitive license review are recorded
