  - id: LIC-008
    statement: the version and license locks are closed ACTIVE or DEFERRED inventories and every actual module package lock entry image and CI action must reconcile to an exact ACTIVE entry
    enforcement: [strict-version-inventory, exact-license-cross-check, exact-deferred-inventory, actual-manifest-reconciliation, integrity-by-component-class, mutation-self-tests]
