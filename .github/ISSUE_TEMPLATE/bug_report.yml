name: Bug report
description: Report a reproducible problem with ingestion, search, evidence, MCP, or the interface.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve KnowVault. Use synthetic examples and remove credentials and company data.
        For vulnerabilities, follow [SECURITY.md](https://github.com/avangerus/knowvault/blob/main/SECURITY.md) instead of reporting the details here.
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Include the server revision and, if relevant, the worker or UI revision.
      placeholder: "Commit SHA or release tag"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does the problem occur?
      options:
        - Document ingestion
        - PostgreSQL snapshots
        - Search or evidence reading
        - MCP client integration
        - Web interface or model answer
        - Installation or operations
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a small synthetic input or a sanitized request when useful.
      placeholder: |
        1. Connect a source containing ...
        2. Search for ...
        3. Open ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: For model answers, distinguish missing search results from an incorrect interpretation of a readable source.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment and diagnostics
      description: Client, browser, deployment method, model profile, source type, or a short sanitized error. Do not paste access codes or full production logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, customer data, and private infrastructure details.
          required: true
