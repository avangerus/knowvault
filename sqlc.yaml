version: "2"
sql:
  - engine: postgresql
    schema:
      - db/migrations
    queries:
      - db/queries
    gen:
      go:
        package: dbgen
        out: internal/platform/database/generated
        sql_package: pgx/v5
        emit_db_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: true
        emit_prepared_queries: false
        emit_sql_as_comment: true
        emit_methods_with_db_argument: true
