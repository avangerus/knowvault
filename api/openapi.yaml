openapi: 3.1.1
info:
  title: KnowVault Internal API
  version: 0.0.0-stage1
  description: >-
    Authenticated on-edge KnowVault API for workspace administration, source ingestion, keyword and
    semantic retrieval, evidence reads, agent access, audit metadata and optional model answers. The
    server composes these routes behind startup, tenant-security and workspace-authorization gates;
    model and connector availability still depends on configured capabilities. The info.version,
    x-implementation-status and x-knowvault-ui-surfaces status values include retained historical
    annotations and are not current deployment-readiness or pilot-acceptance guarantees. See [pilot
    status](../docs/PILOT-STATUS.md) for the qualified release scope; a described endpoint or
    optional capability does not by itself establish production readiness.
  x-implementation-status: HANDLER_READY_NOT_COMPOSED
servers:
  - url: /api/v1
tags:
  - name: System
    description: "Process diagnostics without tenant or source content."
  - name: Workspace
    description: >-
      Protected workspace control plane composed in the server. JSON request objects are limited to
      32768 bytes and decoded strictly: duplicate or unknown members, case aliases, invalid UTF-8,
      non-object bodies, and trailing JSON values are rejected.
    x-implementation-status: LIVE
  - name: Search
    description: >-
      Workspace retrieval and persisted Question Runs with EXTRACTIVE, TOOL_LOOP and compatibility
      GENERATIVE modes. Runs record their workspace revision, answer mode and evidence references;
      the selected mode determines verification. Model profiles are workspace-scoped, and valid
      citations alone do not establish answer completeness or correctness.
    x-implementation-status: LIVE_EXTRACTIVE
  - name: Sources
    description: >-
      Source registration, workspace binding and activation, including scheduled refresh for mounted
      folders and prepared PostgreSQL projections. Git registration remains declarative; a listed
      source type does not establish a configured or healthy connector.
    x-implementation-stage: STAGE_2_AND_5
  - name: Access
    description: >-
      Implemented workspace-scoped agent access-code issuance, listing and revocation, plus
      managed-source confirmation operations. Each operation applies its current owner or
      delegated-authority checks; access to these controls does not automatically grant
      source-content access.
    x-implementation-stage: STAGE_1
  - name: Audit
    description: >-
      Implemented, paginated workspace audit-metadata reads with current tenant, workspace and
      audit.read_metadata checks. The response excludes document bodies, model answers and SQL;
      audit access does not automatically grant source-content access.
    x-implementation-stage: STAGE_1
x-knowvault-ui-surfaces:
  - id: workspace
    label: "Workspaces"
    api_tag: Workspace
    status: LIVE
  - id: search
    label: "Search"
    api_tag: Search
    status: LIVE_EXTRACTIVE
  - id: sources
    label: "Sources"
    api_tag: Sources
    status: LIVE
  - id: access
    label: "Access"
    api_tag: Access
    status: RESERVED_NO_HANDLER
  - id: audit
    label: "Activity log"
    api_tag: Audit
    status: RESERVED_NO_HANDLER
paths:
  /system/health:
    get:
      operationId: getSystemHealth
      tags: [System]
      summary: "Process health"
      description: "Does not check readiness of future business modules or expose their data."
      responses:
        "200":
          description: "The process is running."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /system/build-info:
    get:
      operationId: getBuildInfo
      tags: [System]
      summary: "Build identity"
      description: "Returns only versioned build metadata, without configuration or secrets."
      responses:
        "200":
          description: "Metadata for the exact build."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfoResponse"

  /system/capabilities:
    get:
      operationId: getSystemCapabilities
      tags: [System]
      summary: "Actual process capabilities and readiness"
      description: >-
        Returns only a content-free snapshot of server capabilities. READY means that the
        corresponding server-owned adapter is composed and has passed the startup gate;
        PARTIAL/BLOCKED/UNAVAILABLE retain the external blocker. The endpoint exposes no tenant,
        source, endpoint, secret, or payload data and does not constitute Enterprise release
        acceptance.
      x-implementation-status: LIVE
      responses:
        "200":
          description: "Capability snapshot without configuration or tenant data."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemCapabilitiesResponse"

  /session/csrf:
    get:
      operationId: getCSRFToken
      tags: [Workspace]
      summary: "Get the current session's CSRF proof"
      description: >-
        Requires one valid transport credential: a session cookie for the browser, or the same
        server-issued session token in Authorization: Bearer for API/MCP. Returns only a
        tenant-bound derived proof, never the raw session cookie. The response always uses no-store.
      x-implementation-status: HANDLER_READY_NOT_COMPOSED
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        "200":
          $ref: "#/components/responses/CSRFResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [Workspace]
      summary: "List visible workspaces"
      description: "Query parameters are not supported."
      x-implementation-status: HANDLER_READY_NOT_COMPOSED
      security:
        - SessionCookie: []
        - BearerSession: []
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceListResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createWorkspace
      tags: [Workspace]
      summary: "Create a workspace"
      description: >-
        The only mutation without If-Match. Idempotency-Key is required; its raw value is neither
        stored in audit nor returned.
      x-implementation-status: HANDLER_READY_NOT_COMPOSED
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMetadataInput"
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CreateForbiddenOrCSRFRejected"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspace_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      operationId: getWorkspace
      tags: [Workspace]
      summary: "Current workspace configuration"
      x-implementation-status: HANDLER_READY_NOT_COMPOSED
      security:
        - SessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: replaceWorkspaceMetadata
      tags: [Workspace]
      summary: "Completely replace workspace metadata"
      x-implementation-status: HANDLER_READY_NOT_COMPOSED
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMetadataInput"
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspace_id}:archive:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    post:
      operationId: archiveWorkspace
      tags: [Workspace]
      summary: "Transition the workspace to ARCHIVED"
      description: "No body is allowed; even `{}` is an invalid request."
      x-implementation-status: HANDLER_READY_NOT_COMPOSED
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspace_id}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    post:
      operationId: addWorkspaceMember
      tags: [Workspace]
      summary: "Add a member"
      x-implementation-status: HANDLER_READY_NOT_COMPOSED
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberInput"
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspace_id}/member-candidates:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      operationId: listWorkspaceMemberCandidates
      tags: [Workspace]
      summary: "Find workspace membership candidates (P10a)"
      description: >-
        Reads only ACTIVE USER principals in the caller's organization and returns a bounded
        deterministic list of candidates (principal_id, display_name), with already_member
        indicating existing membership so the UI does not guess identifiers or permit duplicate
        additions. Available only to callers who manage this workspace's members (OWNER or MANAGER
        of an active workspace, using the same gate as AddMember). The search does not mutate state
        or return credentials, email, external identity links, inactive/service/group principals, or
        other tenants. q is matched literally as a case-insensitive substring of id or display_name,
        with LIKE metacharacters escaped: 2..100 Unicode characters after trimming, at most 20
        results, and an accurate truncated flag.
      parameters:
        - name: q
          in: query
          required: true
          description: >-
            Literal search: a case-insensitive substring of id or display_name, with LIKE
            metacharacters escaped. Requires 2..100 Unicode characters after trimming. Exactly one q
            parameter; duplicates or an empty value produce REQUEST_INVALID.
          schema:
            type: string
            minLength: 2
            maxLength: 100
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      responses:
        "200":
          description: "Bounded candidate list with an accurate truncation flag."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [candidates, truncated]
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemberCandidate"
                  truncated:
                    type: boolean
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspace_id}/members/{principal_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/PrincipalID"
    put:
      operationId: changeWorkspaceMemberRole
      tags: [Workspace]
      summary: "Change a member's role"
      x-implementation-status: HANDLER_READY_NOT_COMPOSED
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleInput"
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: removeWorkspaceMember
      tags: [Workspace]
      summary: "Remove a member"
      description: "No body is allowed; even `{}` is an invalid request."
      x-implementation-status: HANDLER_READY_NOT_COMPOSED
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspace_id}:transfer-ownership:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    post:
      operationId: transferWorkspaceOwnership
      tags: [Workspace]
      summary: "Transfer ownership to an existing member"
      x-implementation-status: HANDLER_READY_NOT_COMPOSED
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnershipInput"
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "412":
          $ref: "#/components/responses/RevisionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources:
    post:
      operationId: registerSource
      tags: [Sources]
      summary: "Register a FOLDER, GIT, MAIL, or POSTGRESQL_QUERY source (DRAFT lineage)"
      description: >-
        Content-based idempotency: repeating the same body returns the same derived IDs with
        created=false. Idempotency-Key and If-Match are prohibited. Organization owner only.
      x-implementation-status: HANDLER_READY_NOT_COMPOSED
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceRegisterInput"
      responses:
        "200":
          $ref: "#/components/responses/SourceRegisterResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CreateForbiddenOrCSRFRejected"
        "409":
          $ref: "#/components/responses/SourceConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources/connections:
    post:
      operationId: bootstrapPostgreSQLConnection
      tags: [Sources]
      summary: "Configure a DRAFT PostgreSQL connection before selecting a view"
      description: >-
        Creates only an immutable connection revision and sealed trust configuration. Does not
        create a scope, activation, workspace binding, or content job. The body accepts no DSN,
        password, SQL, tables, or columns. Idempotency-Key and If-Match are prohibited; an exact
        retry converges on the server-derived connection lineage.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, database_identity, lineage_id]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 256
                database_identity:
                  type: string
                  minLength: 1
                  maxLength: 256
                lineage_id:
                  type: string
                  minLength: 1
                  maxLength: 256
                credential_reference:
                  type: string
                  pattern: '^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                workspace_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: >-
                    Card D-1: when present, the unfinished connection is registered as this
                    workspace's draft and appears in its Sources surface. The connection lineage
                    itself stays organization-scoped.
      responses:
        "200":
          description: Immutable DRAFT connection revision
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [connection_id, connection_revision, credential_reference, created]
                properties:
                  connection_id:
                    type: string
                  connection_revision:
                    type: integer
                    format: int64
                    minimum: 1
                  credential_reference:
                    type: string
                  created:
                    type: boolean
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CreateForbiddenOrCSRFRejected"
        "409":
          $ref: "#/components/responses/SourceConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources/connections/{connection_id}:discover:
    parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^conn_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
    post:
      operationId: discoverPostgreSQLConnection
      tags: [Sources]
      summary: "Discover available PostgreSQL views before registering a scope"
      description: >-
        Enqueues a bounded catalog-only probe of the current DRAFT revision in the durable queue.
        The server determines the connection revision, trust hash, and limits. The body is empty;
        Idempotency-Key is required.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Durable discovery request accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id, created]
                properties:
                  request_id:
                    type: string
                    pattern: '^sdrq_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                  created:
                    type: boolean
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CreateForbiddenOrCSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources/discovery/{request_id}:
    parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^sdrq_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
    get:
      operationId: getSourceDiscovery
      tags: [Sources]
      summary: "Get discovery status and the safe view catalog"
      description: >-
        Returns only the current OWNER's catalog from a still-valid encrypted result. OID, trust
        hash, credentials, and database identity are excluded; view_id is a server-owned opaque
        selector.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Discovery state and optional terminal view inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDiscoveryResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sources/discovery/{request_id}/views/{view_id}:register:
    parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^sdrq_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      - name: view_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^sdv_[0-9a-f]{64}$'
    post:
      operationId: registerDiscoveredPostgreSQLView
      tags: [Sources]
      summary: "Register the selected prepared view as a DRAFT scope"
      description: >-
