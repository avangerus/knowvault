        page); without source_id the response lists the workspace's PostgreSQL sources. Columns
        excluded at registration are never returned. An unknown, foreign, disabled or non-member
        source is a single content-free 404 NOT_FOUND. Every call is audited through the existing
        source.metadata.read.* boundary; no external database is opened and no SQL is composed.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSchemaToolRequest"
      responses:
        "200":
          description: "One page of the source schema, or the workspace's PostgreSQL source list when source_id is omitted."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSchemaToolResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspace_id}/tools/source-sql:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    post:
      operationId: workspaceSourceSQLToolParity
      tags: [Sources]
      summary: "REST parity of the knowvault_source_sql MCP tool (ADR-0097, S3)"
      description: >-
        Agent-facing REST twin of the knowvault_source_sql knowledge tool: one SELECT/WITH statement
        written by the caller (the chat model or an authenticated MCP/API agent) against one
        PostgreSQL source enabled in the workspace. The statement runs with the source's own
        read-only query credential, in a read-only transaction, under the shared governed-execution
        statement timeout, EXPLAIN cost cap and row/byte cap; every relation the planner touches must
        belong to the source's registered tables, so pg_catalog, information_schema, another schema
        and a function scan are refused. The body carries source_id, sql (at most 8192 bytes) and a
        bounded purpose note. A closed refusal (SQL_REJECTED_STATIC, RELATION_NOT_IN_SOURCE,
        COST_LIMIT, ROW_LIMIT, TIMEOUT, DATABASE_REJECTED, SOURCE_SQL_NOT_CONFIGURED) is a 200 tool
        result with an error code the agent reacts to. An unknown, foreign, disabled or non-member
        source is a single content-free 404 NOT_FOUND. No UI, operator or user-facing field accepts
        SQL. Every attempt is audited with the source id, sql hash and result digest; a failed audit
        returns no rows.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSQLToolRequest"
      responses:
        "200":
          description: "The executed statement's text-table projection, or a closed refusal result carrying its error code."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSQLToolResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspace_id}/governed-query-connections/{connection_id}:set-live-queries:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: connection_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/OpaqueID"
    post:
      operationId: setGovernedQueryLiveQueries
      tags: [Sources]
      summary: "Set whether live model queries are allowed for a connection (ADR-0089 section 6)"
      description: "Disabled by default. The body contains only the flag; DSN, credentials, and SQL are never accepted."
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: "Connection and the current flag value."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspace_id}/governed-query-connections/{connection_id}/exposed-schema:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: connection_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/OpaqueID"
    post:
      operationId: registerGovernedQueryExposedSchema
      tags: [Sources]
      summary: "Register an operator-exposed schema (ADR-0089 section 1)"
      description: >-
        The operator lists tables and columns exposed to the model. The server checks them against
        the dedicated role's information_schema and stores an immutable revision. Repeating the same
        schema converges on its revision.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [objects]
              properties:
                objects:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: "Exposed-schema revision."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/GovernedQueryUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspace_id}/governed-query-connections/{connection_id}:ask:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: connection_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/OpaqueID"
    post:
      operationId: askGovernedQuery
      tags: [Search]
      summary: "Ask a natural-language question over the exposed schema (ADR-0089)"
      description: >-
        The model composes SQL against the exposed schema. A dedicated read-only role executes it
        with a timeout, row limit, and plan check. There is no SQL input field. The response
        contains the executed query, its hash, attempt ID, and complete result table. Values
        preserve their PostgreSQL text representation; SQL NULL is returned as JSON null. The
        execution interval is the query time, not the source record's modification time.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        "200":
          description: "Executed query, table, and result provenance."
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, result]
                properties:
                  connection_id:
                    $ref: "#/components/schemas/OpaqueID"
                  result:
                    $ref: "#/components/schemas/GovernedQueryResult"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/GovernedQueryUnavailable"
        "422":
          $ref: "#/components/responses/GovernedQueryFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspaces/{workspace_id}/governed-query-connections/{connection_id}:promote:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: connection_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/OpaqueID"
    post:
      operationId: promoteGovernedQueryAttempt
      tags: [Sources]
      summary: "Save an executed attempt as a verified projection (ADR-0089 section 5)"
      description: >-
        The body contains only a reference to the attempt and the hash the operator saw alongside
        the executed query; a SQL field is prohibited (PRODUCT_CONSTITUTION.md section 7). A hash
        mismatch with the retained attempt produces a content-free denial.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attempt_id, sql_hash]
              properties:
                attempt_id:
                  $ref: "#/components/schemas/OpaqueID"
                sql_hash:
                  type: string
                  pattern: "^sha256:[0-9a-f]{64}$"
                name:
                  type: string
                  maxLength: 200
                schedule:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: "Save status, attempt identifier, and its hash."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/GovernedQueryUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /source-connectors:
    get:
      operationId: listSourceConnectors
      tags: [Sources]
      summary: "Versioned source-type catalog for onboarding"
      description: >-
        Only deterministic, content-free, read-only metadata for registration types (FOLDER,
        POSTGRESQL_QUERY, GIT). Excludes configured sources, credentials, raw DSNs, source-specific
        table/column names, database type fingerprints and hidden mounts. Authorization uses the
        same source-management OWNER policy as other source operations. An unauthenticated request
        returns 401; a policy denial returns the same content-free NOT_FOUND as other source reads
        without revealing configured sources. General discovery is not implemented. FOLDER and
        POSTGRESQL_QUERY have autonomous schedule-driven worker synchronization; GIT requires an
        explicitly refreshed checkout or provider. Supporting a type does not mean that a connection
        is configured or healthy.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      responses:
        "200":
          description: "Versioned connector-type catalog (schema_version=1.0)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorCatalogResponse"
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-knowvault_session
      description: >-
        Server-issued, Secure, HttpOnly, host-only session cookie. OIDC
        issuance remains a separate authentication boundary.
    BearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: >-
        The same server-issued opaque session token may be sent once as
        Authorization: Bearer for non-browser API/MCP clients. Do not combine
        it with a Cookie header. This is not a long-lived service credential.
  parameters:
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueID"
    PrincipalID:
      name: principal_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueID"
    SourceScopeID:
      name: source_scope_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueID"
    QuestionRunID:
      name: question_run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueID"
    ConversationID:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueID"
    CSRFHeader:
      name: X-KnowVault-CSRF
      in: header
      required: true
      description: >-
        Exactly one derived CSRF proof from GET /session/csrf. Origin is also required and must
        exactly match the tenant origin; the handler checks it, but it is not a client-controlled
        tenant selector. These browser-only headers are omitted for Authorization: Bearer session
        transport.
      schema:
        type: string
        pattern: '^hmac-sha256:k[1-9][0-9]{0,8}:[0-9a-f]{64}$'
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: >-
        Exactly one canonical HTTPS origin matching the tenant-bound server origin. Null,
        comma-separated, and cross-origin values are prohibited. Origin is omitted for
        Authorization: Bearer session transport.
      schema:
        type: string
        format: uri
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Exactly one canonical 256-bit base64url value. A retry with the same body returns the
        immutable original result; a retry with a different body returns 409.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Exactly one strong ETag matching the current workspace configuration. Weak tags, wildcards,
        and lists are prohibited.
      schema:
        type: string
        pattern: '^"sha256:[0-9a-f]{64}"$'
    ModelContextVersionParam:
      name: version
      in: path
      required: true
      description: "Immutable context version number: a positive decimal integer without a sign or leading zeros."
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
    ModelContextProposalIDParam:
      name: proposal_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueID"
    ModelContextIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Exactly one strong ETag: the current context's content hash, or the literal
        "sha256:empty" when the workspace has no saved context yet (version 0). Weak tags,
        wildcards, and lists are prohibited.
      schema:
        type: string
        pattern: '^"sha256:(empty|[0-9a-f]{64})"$'
  headers:
    NoStore:
      description: "All handler JSON responses are noncacheable."
      required: true
      schema:
        type: string
        const: no-store
    RequestID:
      description: Server-generated correlation ID. Absent only if CSPRNG request-ID generation itself failed.
      required: false
      schema:
        type: string
        pattern: '^req_[A-Za-z0-9_-]{22}$'
    ETag:
      description: Strong configuration ETag exact returned Workspace snapshot.
      required: true
      schema:
        type: string
        pattern: '^"sha256:[0-9a-f]{64}"$'
    NoSniff:
      description: Browser content-type sniffing is disabled.
      required: true
      schema:
        type: string
        const: nosniff
    ModelContextETag:
      description: >-
        Strong ETag exact match to the returned context's content_hash, or "sha256:empty" for a
        workspace with no saved context yet (version 0).
      required: true
      schema:
        type: string
        pattern: '^"sha256:(empty|[0-9a-f]{64})"$'
  schemas:
    GovernedQueryResult:
      type: object
      additionalProperties: false
      required: [attempt_id, sql, sql_hash, columns, rows, row_count, cost_estimate, answer, connection_id, database_identity, exposed_schema_revision, result_format, result_digest, execution_started_at, execution_completed_at]
      properties:
        attempt_id:
          type: string
        sql:
          type: string
        sql_hash:
          type: string
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: [string, "null"]
        row_count:
          type: integer
          minimum: 0
        cost_estimate:
          type: number
        answer:
          type: string
        connection_id:
          $ref: "#/components/schemas/OpaqueID"
        database_identity:
          type: string
        exposed_schema_revision:
          type: integer
          minimum: 1
        result_format:
          type: string
          const: postgres-text-table-v1
        result_digest:
          type: string
          description: SHA-256 of canonical JSON with format, columns, row_count and rows, including values and NULLs.
        execution_started_at:
          type: string
          format: date-time
        execution_completed_at:
          type: string
          format: date-time
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, component]
      properties:
        status:
          type: string
          enum: [UP]
        component:
          type: string
          enum: [knowvault-server]
    BuildInfoResponse:
      type: object
      additionalProperties: false
      required: [version, revision, built_at, go_version, go_experiment]
      properties:
        version:
          type: string
          minLength: 1
        revision:
          type: string
          minLength: 1
        built_at:
          type: string
          minLength: 1
        go_version:
          type: string
          minLength: 1
        go_experiment:
          type: string
          minLength: 1
    SystemCapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [schema_version, component, release_eligible, capabilities]
      properties:
        schema_version:
          type: string
          const: system-capabilities-v1
        component:
          type: string
          const: knowvault-server
        release_eligible:
          type: boolean
          const: false
        capabilities:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/SystemCapability"
    SystemCapability:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z][a-z0-9_]{0,127}$'
        status:
          type: string
          enum: [READY, PARTIAL, BLOCKED, UNAVAILABLE]
        reason_code:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Z0-9_]{3,64}$'
    OpaqueID:
      type: string
      minLength: 3
      maxLength: 128
      pattern: '^[A-Za-z0-9_.:-]{3,128}$'
    EvidenceFragmentNeighbor:
      type: object
      additionalProperties: false
      required: [fragment_id, ordinal, canonical_address]
      properties:
        fragment_id:
          type: string
        ordinal:
          type: integer
          format: int64
        canonical_address:
          type: string
    SourceDiscoveryResponse:
      type: object
      additionalProperties: false
      required:
        - request_id
        - request_status
        - view_count
        - prepared_view_count
        - needs_interpretation_view_count
        - expires_at
        - views
      properties:
        request_id:
          type: string
          pattern: '^sdrq_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
        request_status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, EXPIRED]
        result_id:
          type: string
          pattern: '^sdr_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
        result_status:
          type: string
          enum: [SUCCEEDED, NEEDS_INTERPRETATION]
        view_count:
          type: integer
          minimum: 0
          maximum: 1024
        prepared_view_count:
          type: integer
          minimum: 0
          maximum: 1024
        needs_interpretation_view_count:
          type: integer
          minimum: 0
          maximum: 1024
        failure_code:
          type: string
          minLength: 1
          maxLength: 64
        expires_at:
          type: string
          format: date-time
        views:
          type: array
          maxItems: 1024
          items:
            $ref: "#/components/schemas/SourceDiscoveryView"
    SourceDiscoveryView:
      type: object
      additionalProperties: false
      required: [view_id, schema_name, relation_name, relation_kind, approx_row_count, status, columns]
      properties:
        view_id:
          type: string
          pattern: '^sdv_[0-9a-f]{64}$'
        schema_name:
          type: string
          minLength: 1
          maxLength: 63
        relation_name:
          type: string
          minLength: 1
          maxLength: 63
        relation_kind:
          type: string
          description: >-
            VIEW and MATERIALIZED_VIEW are the original DBA-reviewed five-column business-object
            contract. TABLE and PARTITIONED_TABLE (ADR-0097) are an ordinary or partitioned base
            table, prepared only when it has a declared primary key.
          enum: [VIEW, MATERIALIZED_VIEW, TABLE, PARTITIONED_TABLE]
        comment:
          type: string
          maxLength: 4096
        approx_row_count:
          type: integer
          description: >-
            pg_class.reltuples, rounded. -1 means PostgreSQL has not analyzed the relation yet.
            Planner statistics, not a live count; never used for a security or capacity decision.
          minimum: -1
        status:
          type: string
          enum: [PREPARED, NEEDS_INTERPRETATION]
        interpretation:
          type: string
          enum:
            - UNRECOGNIZED_FORMAT
            - INCOMPLETE_BUSINESS_OBJECT_CONTRACT
            - MALFORMED_BUSINESS_OBJECT_CONTRACT
            - UNSUPPORTED_TYPE
            - INVALID_IDENTIFIER
            - NO_PRIMARY_KEY
        columns:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/SourceDiscoveryColumn"
        excluded_columns:
          type: array
          description: >-
            Base or partitioned-table columns the server observed but cannot project into the
            immutable value contract (for example a PostGIS geometry). They are display-only
            metadata carrying a reason, are never part of the registration projection and never
            appear in reads, search, the schema tool or SQL results. A table whose primary key or
            every column is unsupported stays NEEDS_INTERPRETATION with UNSUPPORTED_TYPE.
          maxItems: 256
          items:
            $ref: "#/components/schemas/SourceDiscoveryExcludedColumn"
    SourceDiscoveryExcludedColumn:
      type: object
      additionalProperties: false
      required: [ordinal, name, type_name, reason]
      properties:
        ordinal:
          type: integer
          minimum: 1
          maximum: 256
          description: The column's observed position in the external relation.
        name:
          type: string
          minLength: 1
          maxLength: 63
        type_name:
          type: string
          minLength: 1
          maxLength: 256
        logical_type:
          type: string
          description: Present only when the server recognized a logical type but the column is still unprojectable.
        primary_key:
          type: boolean
        reason:
          type: string
          enum: [UNSUPPORTED_TYPE]
    SourceDiscoveryColumn:
      type: object
      additionalProperties: false
      required: [ordinal, name, type_name, logical_type, nullable, roles, primary_key]
      properties:
        ordinal:
          type: integer
          minimum: 1
          maximum: 256
        name:
          type: string
          minLength: 1
          maxLength: 63
        type_name:
          type: string
          minLength: 1
          maxLength: 256
        logical_type:
          type: string
          enum: [BOOL, INT, NUMERIC, UUID, DATE, TIMESTAMP, TIMESTAMPTZ, TEXT, JSON, JSONB]
        nullable:
          type: boolean
        precision:
          type: integer
          minimum: 0
        scale:
          type: integer
          minimum: 0
        max_bytes:
          type: integer
          minimum: 0
        comment:
          type: string
          maxLength: 4096
        roles:
          type: array
          uniqueItems: true
          maxItems: 6
          items:
            type: string
            enum: [IDENTITY, TITLE, VERSION_HINT, EVIDENCE, PERIOD, STATUS]
        primary_key:
          type: boolean
          description: >-
            Native primary-key membership (ADR-0097). Always false for a VIEW/MATERIALIZED_VIEW
            column.
    SourceDiscoveryRegisterInput:
      type: object
