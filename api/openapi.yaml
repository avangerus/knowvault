            match the retained text_hash (MCP -32005). Returns neither page text nor an address.
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: readWorkspaceToolEvidencePost
      tags: [Search]
      summary: "Explicit fragment or whole-object pages within a workspace (POST parity)"
      description: >-
        The same REST parity with knowvault_read as GET:
