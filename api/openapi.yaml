        job_status:
          type: string
          nullable: true
          enum: [PENDING, RUNNING, SUCCEEDED, DEAD]
        job_attempt_count:
          type: integer
          minimum: 0
          nullable: true
        job_max_attempts:
          type: integer
          minimum: 1
          nullable: true
        job_available_at:
          type: string
          format: date-time
          nullable: true
        job_lease_expires_at:
          type: string
          format: date-time
          nullable: true
        job_last_error_code:
          type: string
          nullable: true
        content_freshness_sla_seconds:
          type: integer
          minimum: 60
          maximum: 604800
        last_successful_sync_at:
          type: string
          format: date-time
          nullable: true
        freshness_state:
          type: string
          enum: [UNKNOWN, FRESH, STALE]
    SourceList:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceStatus"
    WorkspaceSourceBindInput:
      type: object
      additionalProperties: false
      required: [expected_workspace_revision, source_scope_id, source_scope_revision, scope_config_hash, access_mode]
      properties:
        expected_workspace_revision:
          type: integer
          minimum: 1
        source_scope_id:
          $ref: "#/components/schemas/OpaqueID"
        source_scope_revision:
          type: integer
          minimum: 1
        scope_config_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        access_mode:
          type: string
          enum: [WORKSPACE_MANAGED, SOURCE_ENFORCED]
    WorkspaceSourceRemoveInput:
      type: object
      additionalProperties: false
      required: [expected_workspace_revision, workspace_source_id, source_scope_id, source_scope_revision, scope_config_hash, access_mode]
      properties:
        expected_workspace_revision:
          type: integer
          minimum: 1
        workspace_source_id:
          $ref: "#/components/schemas/OpaqueID"
        source_scope_id:
          $ref: "#/components/schemas/OpaqueID"
        source_scope_revision:
          type: integer
          minimum: 1
        scope_config_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        access_mode:
          type: string
          enum: [WORKSPACE_MANAGED, SOURCE_ENFORCED]
    QuestionModelProfileID:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    QuestionModelProfile:
      type: object
      additionalProperties: false
      required: [id, label, location]
      properties:
        id:
          $ref: "#/components/schemas/QuestionModelProfileID"
        label:
          type: string
          minLength: 1
          maxLength: 80
        location:
          type: string
          enum: [INTERNAL, EXTERNAL]
    QuestionModelProfileOption:
      type: object
      additionalProperties: false
      required: [id, label, location, is_default]
      properties:
        id:
          $ref: "#/components/schemas/QuestionModelProfileID"
        label:
          type: string
          minLength: 1
          maxLength: 80
        location:
          type: string
          enum: [INTERNAL, EXTERNAL]
        is_default:
          type: boolean
    QuestionCreateInput:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 32768
        conversation_id:
          description: Existing server-owned conversation to continue; omitted to create a new conversation.
          $ref: "#/components/schemas/OpaqueID"
        model_profile_id:
          description: >-
            Optional ID from this workspace's model_profiles catalogue. Selects
            one immutable adapter for this TOOL_LOOP request; omitted answer_mode
            becomes TOOL_LOOP. Explicit EXTRACTIVE or GENERATIVE with this field
            is invalid. Unknown or unavailable profiles fail without fallback.
            Reusing an idempotency key with a different explicit profile conflicts.
            Omission preserves the legacy default and replay identity.
          $ref: "#/components/schemas/QuestionModelProfileID"
        answer_mode:
          type: string
          description: >-
            Omission selects TOOL_LOOP whenever the server has composed the shared tool runtime; a
            composition without that runtime defaults to EXTRACTIVE. TOOL_LOOP additionally requires
            a generation profile available to this workspace and fails with
            QUESTION_MODE_UNSUPPORTED if none is available, without falling back to EXTRACTIVE. It
            uses the shared workspace knowledge tools and records address-bound citations and tool
            calls. GENERATIVE is a compatibility mode, available only when an explicit Model Gateway
            generation mount is wired for the caller's workspace (GEN-2, ADR-0088). A GENERATIVE
            request without that mount is rejected with QUESTION_MODE_UNSUPPORTED before any run is
            created.
          enum: [EXTRACTIVE, GENERATIVE, TOOL_LOOP]
    ConversationTurn:
      type: object
      additionalProperties: false
      required: [turn_id, question_run_id, turn_index, created_at]
      properties:
        turn_id:
          $ref: "#/components/schemas/OpaqueID"
        question_run_id:
          $ref: "#/components/schemas/OpaqueID"
        turn_index:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        created_at:
          type: string
          format: date-time
        question_run:
          description: Current-access-checked Question Run projection; omitted when a concurrent revocation removes disclosure.
          allOf:
            - $ref: "#/components/schemas/QuestionRun"
    Conversation:
      type: object
      additionalProperties: false
      required: [conversation_id, workspace_id, workspace_revision, created_by, created_at, turns]
      properties:
        conversation_id:
          $ref: "#/components/schemas/OpaqueID"
        workspace_id:
          $ref: "#/components/schemas/OpaqueID"
        workspace_revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        created_by:
          $ref: "#/components/schemas/OpaqueID"
        created_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        turns:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ConversationTurn"
    ConversationList:
      type: object
      additionalProperties: false
      required: [conversations]
      properties:
        conversations:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Conversation"
        next_cursor:
          type: string
          minLength: 3
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:-]{3,128}$'
          description: >-
            Opaque conversation_id of the last returned thread. Present only when another page
            exists; the client returns it unchanged in cursor.
    QuestionCitation:
      type: object
      additionalProperties: false
      required: [number, citation_id, evidence_fragment_id, excerpt, anchor, deep_link, source_version_id, extraction_id, source_object_id, evidence_text_hash, excerpt_hash]
      properties:
        address:
          type: string
          description: Canonical address returned by a knowledge tool and read back before binding this quote.
          pattern: '^kv1:'
        number:
          type: integer
          minimum: 1
        citation_id:
          $ref: "#/components/schemas/OpaqueID"
        evidence_fragment_id:
          $ref: "#/components/schemas/OpaqueID"
        excerpt:
          type: string
          minLength: 1
          maxLength: 32768
        anchor:
          type: string
          minLength: 1
          maxLength: 32768
        deep_link:
          type: string
          minLength: 1
          maxLength: 4096
        source_version_id:
          $ref: "#/components/schemas/OpaqueID"
        extraction_id:
          $ref: "#/components/schemas/OpaqueID"
        source_object_id:
          $ref: "#/components/schemas/OpaqueID"
        evidence_text_hash:
          type: string
          description: Organization-scoped HMAC digest copied from the authorized Evidence fragment; plain SHA is never exposed.
          pattern: '^hmac-sha256:k[1-9][0-9]{0,8}:[0-9a-f]{64}$'
        excerpt_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        source_quote:
          description: >-
            SOURCE_QUOTE binding: present only when the citation is bound to an
            exact span of the stored extraction. Absent (or unbound) citations
            remain readable and are labelled UNCONFIRMED.
          $ref: "#/components/schemas/SourceQuote"
        grounding_status:
          type: string
          description: >-
            Per-citation R1 grounding state exposed by REST and MCP. CONFIRMED_BY_FRAGMENT
            ("confirmed by fragment") applies only when source_quote is present, its span [start,
            end) lies inside the retained extraction's normalized text, and text_hash hashes exactly
            that span text. Everything else, including a paraphrase supported only by embedding
            similarity, is UNCONFIRMED ("unconfirmed"); similarity is never proof.
          enum: [CONFIRMED_BY_FRAGMENT, UNCONFIRMED]
          default: UNCONFIRMED
    SourceQuote:
      type: object
      additionalProperties: false
      required: [source_version_id, extraction_id, anchor, start, end, text_hash]
      description: >-
        SOURCE_QUOTE = {source_version_id, extraction_id, anchor, start, end,
        text_hash}. start/end are 0-based character offsets into the
        extraction's normalized text (end exclusive); text_hash is the hash of
        exactly that span. A citation whose span hash does not match the stored
        extraction is unbound (UNCONFIRMED).
      properties:
        source_version_id:
          $ref: "#/components/schemas/OpaqueID"
        extraction_id:
          $ref: "#/components/schemas/OpaqueID"
        anchor:
          type: string
          minLength: 1
          maxLength: 32768
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        text_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    QuestionUncertainty:
      type: object
      additionalProperties: false
      required: [code, evidence_ids]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        evidence_ids:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/OpaqueID"
        message:
          description: >-
            Server-owned, closed-vocabulary English sentence derived solely from code (FIX-2 #6).
            Recomputed on every read; never persisted.
          type: string
          maxLength: 512
    QuestionConflict:
      type: object
      additionalProperties: false
      required: [code, evidence_ids]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        evidence_ids:
          type: array
          minItems: 2
          maxItems: 256
          items:
            $ref: "#/components/schemas/OpaqueID"
        message:
          description: >-
            Server-owned, closed-vocabulary English sentence derived solely from code (FIX-2 #6).
          type: string
          maxLength: 512
    QuestionRun:
      type: object
      additionalProperties: false
      required: [question_run_id, workspace_id, workspace_revision, question, answer_mode, verification_method, status, corpus_status, freshness, started_at, manifest_status, planning_status, planning_operation, planning_confidence, citations, uncertainties, conflicts]
      properties:
        tool_loop:
          $ref: "#/components/schemas/QuestionToolLoop"
        model_profile:
          description: >-
            Actual selection captured in the encrypted terminal tool-loop trace,
            including its label and location at execution time. Not resolved from
            current configuration. Absent for older traces and when a run failed
            before its trace could be persisted.
          $ref: "#/components/schemas/QuestionModelProfile"
        question_run_id:
          $ref: "#/components/schemas/OpaqueID"
        workspace_id:
          $ref: "#/components/schemas/OpaqueID"
        workspace_revision:
          type: integer
          minimum: 1
        conversation_id:
          description: Server-owned workspace-scoped conversation containing this turn.
          $ref: "#/components/schemas/OpaqueID"
        conversation_turn_id:
          description: Server-owned append-only turn bound to this Question Run.
          $ref: "#/components/schemas/OpaqueID"
        question:
          type: string
          minLength: 1
        answer_mode:
          type: string
          description: >-
            EXTRACTIVE (BYTE_EXACT_CITATION) selects authorized Evidence byte spans. TOOL_LOOP
            (ADDRESS_BOUND) calls the shared workspace knowledge tools with the selected
            workspace-available model profile and records address-bound citations and tool calls;
            source quotation checks do not by themselves prove answer completeness or semantic
            correctness. GENERATIVE (SEMANTIC_VERIFIER) sends selected Evidence and the question
            through the Model Gateway's interim adapter (GEN-2, ADR-0088). Its embedding-similarity
            verifier remains a ranking hint and never confirms a claim by itself: grounding requires
            a SOURCE_QUOTE whose span text is present in the stored extraction. An unverifiable
            GENERATIVE attempt completes its run in terminal INSUFFICIENT_EVIDENCE. The answer mode
            is fixed for the life of the run once created.
          enum: [EXTRACTIVE, GENERATIVE, TOOL_LOOP]
        verification_method:
          type: string
          enum: [BYTE_EXACT_CITATION, SEMANTIC_VERIFIER, ADDRESS_BOUND]
        grounding_status:
          type: string
          description: >-
            Answer-level R1 grounding state exposed identically by REST and MCP.
            CONFIRMED_BY_FRAGMENT ("confirmed by fragment") applies only when every claim has a
            bound SOURCE_QUOTE whose span text is present in the retained extraction. Anything else,
            including a paraphrase supported only by embedding similarity, is UNCONFIRMED
            ("unconfirmed"). The similarity threshold is not a proof input.
          enum: [CONFIRMED_BY_FRAGMENT, UNCONFIRMED]
          default: UNCONFIRMED
        status:
          type: string
          enum: [RUNNING, COMPLETED, INSUFFICIENT_EVIDENCE, FAILED, CANCELLED]
        corpus_status:
          type: string
          enum: [COMPLETE, PARTIAL]
        freshness:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state:
              type: string
              enum: [FRESH, STALE, FAILED, UNKNOWN, DISABLED]
            captured_at:
              type: string
              format: date-time
            last_successful_sync_at:
              type: string
              format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        answer:
          type: string
        answer_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        context_pack_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        manifest_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        manifest_status:
          type: string
          enum: [NOT_PUBLISHED, PUBLISHED]
        planning_status:
          type: string
          enum: [READY, UNKNOWN, CLARIFICATION_REQUIRED]
        planning_operation:
          type: string
          enum: [LOOKUP, EXPLAIN, COMPARE, AGGREGATE, AUDIT, CODE_TRACE, UNKNOWN, CLARIFY]
        planning_confidence:
          type: string
          enum: [NONE, LOW, MEDIUM, HIGH]
        plan_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        clarification:
          type: string
          maxLength: 2048
        citations:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/QuestionCitation"
        uncertainties:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/QuestionUncertainty"
        conflicts:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/QuestionConflict"
        failure_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        answer_result:
          description: >-
            FIX-2 #1: structured counterpart of an AGGREGATE/LIST answer
            (populated only for a run answered by the snapshot reducer).
          $ref: "#/components/schemas/QuestionAnswerResult"
        understood:
          description: FIX-2 #2 ("Interpreted as"): populated only when Create spliced a bare period follow-up onto a prior turn's question.
          $ref: "#/components/schemas/QuestionUnderstood"
        searched:
          description: FIX-2 #6 ("where searched"), populated only when uncertainties includes INSUFFICIENT_EVIDENCE.
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/QuestionSearchedSource"
    QuestionToolLoop:
      type: object
      additionalProperties: false
      description: Encrypted run trace, reauthorized against every retrieved fragment before disclosure; provider reasoning is excluded.
      required: [profile, model, calls, messages, usage, stop_reason, all_claims_bound]
      properties:
        model_profile:
          $ref: "#/components/schemas/QuestionModelProfile"
        profile:
          type: object
          additionalProperties: false
          required: [id, max_turns, max_tool_calls, max_input_bytes, max_tool_result_bytes, max_output_tokens, timeout_seconds]
          properties:
            id: { type: string }
            model_artifact_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            thinking_mode: { type: string, enum: [disabled, enabled] }
            sampling:
              type: object
              additionalProperties: false
              required: [temperature, top_p, top_k, min_p, presence_penalty, repeat_penalty, seed]
              properties:
                temperature: { type: number, minimum: 0, maximum: 2 }
                top_p: { type: number, exclusiveMinimum: 0, maximum: 1 }
                top_k: { type: integer, minimum: 1, maximum: 200 }
                min_p: { type: number, minimum: 0, maximum: 1 }
                presence_penalty: { type: number, minimum: 0, maximum: 2 }
                repeat_penalty: { type: number, exclusiveMinimum: 0, maximum: 2 }
                seed: { type: integer, minimum: 0, maximum: 2147483647 }
            max_turns: { type: integer, minimum: 2, maximum: 20 }
            max_tool_calls: { type: integer, minimum: 2, maximum: 40 }
            max_input_bytes: { type: integer, minimum: 8192, maximum: 524288 }
            max_tool_result_bytes: { type: integer, minimum: 1024, maximum: 262144 }
            max_output_tokens: { type: integer, minimum: 256, maximum: 16384 }
            timeout_seconds: { type: integer, minimum: 10, maximum: 270 }
        model: { type: string }
        stop_reason:
          type: string
          enum: [ANSWER, CLARIFICATION, TURN_LIMIT, TOOL_LIMIT, TRACE_LIMIT, TIME_LIMIT, CONTEXT_LIMIT, MODEL_UNAVAILABLE, OUTPUT_LIMIT, FORMAT_INVALID, CITATIONS_UNVERIFIED]
        all_claims_bound: { type: boolean }
        usage:
          type: object
          additionalProperties: false
          required: [prompt_tokens, completion_tokens, total_tokens]
          properties:
            prompt_tokens: { type: integer, minimum: 0 }
            completion_tokens: { type: integer, minimum: 0 }
            total_tokens: { type: integer, minimum: 0 }
        calls:
          type: array
          maxItems: 40
          items:
            type: object
            additionalProperties: false
            required: [id, name, arguments, arguments_hash, system, outcome, duration_ms, result]
            properties:
              id: { type: string }
              name: { type: string }
              arguments:
                type: object
                description: Tool-specific arguments, validated against the registered closed tool schema.
                additionalProperties: true
              arguments_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
              system: { type: boolean }
              outcome: { type: string, enum: [SUCCEEDED, REFUSED] }
              duration_ms: { type: integer, minimum: 0 }
              result:
                type: object
                additionalProperties: false
                required: [text, is_error]
                properties:
                  text: { type: string }
                  is_error: { type: boolean }
                  structured:
                    type: object
                    description: Structured result of the registered MCP tool.
                    additionalProperties: true
        messages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant, tool] }
              content: { type: string }
              tool_call_id: { type: string }
              tool_calls:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, type, function]
                  properties:
                    id: { type: string }
                    type: { type: string, enum: [function] }
                    function:
                      type: object
                      additionalProperties: false
                      required: [name, arguments]
                      properties:
                        name: { type: string }
                        arguments: { type: string }
    QuestionAnswerFilter:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          maxLength: 256
        value:
          type: string
          maxLength: 4096
    QuestionAnswerPeriod:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
        to:
          type: string
        label:
          type: string
          maxLength: 256
    QuestionAnswerSnapshot:
      type: object
      additionalProperties: false
      required: [row_count]
      properties:
        id:
          type: string
        captured_at:
          type: string
          format: date-time
        row_count:
          type: integer
          minimum: 0
    QuestionAnswerKey:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    QuestionAnswerResult:
      type: object
      additionalProperties: false
      required: [kind, operation, rule, snapshot, completeness]
      properties:
        kind:
          type: string
          description: CALCULATION is a deterministic snapshot reduction; LIVE_TABLE is a complete governed live read whose rows remain in the encrypted tool trace.
          enum: [CALCULATION, LIVE_TABLE]
        value:
          type: string
        unit:
          type: string
        operation:
          type: string
          enum: [COUNT, SUM, LIST, GOVERNED_READ]
        rule:
          type: string
        filters:
          type: array
          items:
            $ref: "#/components/schemas/QuestionAnswerFilter"
        period:
          $ref: "#/components/schemas/QuestionAnswerPeriod"
        timezone:
          type: string
        snapshot:
          $ref: "#/components/schemas/QuestionAnswerSnapshot"
        keys:
          type: array
          items:
            $ref: "#/components/schemas/QuestionAnswerKey"
        completeness:
          type: string
          enum: [COMPLETE, PARTIAL]
        # R2 Outcome 3 ("Semantics"/"Result"): the unified AnswerResult
        # fields, additive beside every R1 field above. All of them are
        # optional and a legacy answer that omits them still validates (the
        # required list is unchanged); a genuinely absent value stays absent
        # so the UI renders "no data" rather than an invented value.
        run_id:
          description: >-
            R2 Outcome 3: the Question Run this answer belongs to. The
            per-run identity is deliberately not folded into result_digest, so
            two runs of the same validated intent over the same snapshot tie
            out. Optional for a pre-R2 answer.
          type: string
          maxLength: 128
        intent:
          $ref: "#/components/schemas/QuestionAnswerIntent"
        rowset_ref:
          description: >-
            R2 Outcome 3: opaque reference to the rowset this answer was
            reduced from, when the run carries one. Never a raw SQL text.
          type: string
          maxLength: 256
        metric_version:
          description: >-
            R2 Outcome 3: version of the APPROVED MetricDefinition the
            validated intent executed against; absent for a run with no
            definition-backed intent.
          type: string
          maxLength: 64
        snapshot_id:
          description: >-
            R2 Outcome 3: stable snapshot identity the result digest is keyed
            by (never the per-run id).
          type: string
          maxLength: 128
        execution_id:
          description: >-
            R2 Outcome 3: stable execution identity the result digest is keyed
            by (never the per-run id).
          type: string
          maxLength: 128
        result_digest:
          description: >-
            For CALCULATION, SHA-256 of the canonical (RFC 8785/JCS)
            calculation projection and its stable identity. For LIVE_TABLE,
            the exact governedquery digest of {format, columns, row_count, rows}.
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        observation_window:
          $ref: "#/components/schemas/QuestionAnswerObservationWindow"
        receipt_digest:
          description: >-
            SHA-256 of the canonical (RFC 8785/JCS) server receipt projection.
            For LIVE_TABLE this binds the Question Run, operation, attempt,
            SQL hash, exposed-schema revision, database identity, exact result
            digest, row count, completeness and server execution window. It
            contains no SQL text or connection id.
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        freshness:
          $ref: "#/components/schemas/QuestionAnswerFreshness"
        evidence_refs:
          description: >-
            R2 Outcome 3: evidence identifiers the answer was grounded on.
          type: array
          items:
            $ref: "#/components/schemas/OpaqueID"
        audit_receipt:
          description: >-
            R2 Outcome 3: references to the R1 admission/outcome audit events
            for this run (audit identifiers, never audit content).
          type: array
          items:
            $ref: "#/components/schemas/OpaqueID"
    QuestionAnswerObservationWindow:
      type: object
      additionalProperties: false
      properties:
        basis:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    QuestionAnswerIntent:
      description: >-
        R2 Outcome 3: read-only projection of the QueryIntent the server validated against an
        APPROVED MetricDefinition before executing the run. Absent for every run that never carried
        a validated intent; in that case the answer panel shows "no data".
      type: object
      additionalProperties: false
      properties:
        metric_id:
          type: string
          maxLength: 128
        version:
          description: Monotonic per-id version of the APPROVED MetricDefinition.
          type: integer
          minimum: 1
        period:
          $ref: "#/components/schemas/QuestionAnswerPeriod"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/QuestionAnswerFilter"
        output:
          type: string
          maxLength: 64
        as_of:
          description: Server-resolved as-of instant the validated intent used.
          type: string
          maxLength: 64
    QuestionAnswerFreshness:
      description: >-
        R2 Outcome 3: the immutable corpus-freshness snapshot the answer was
        produced against, optionally carried on AnswerResult. Same closed
        vocabulary as the run-level freshness field.
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [FRESH, STALE, FAILED, UNKNOWN, DISABLED]
        captured_at:
          type: string
          format: date-time
        last_successful_sync_at:
          type: string
          format: date-time
    QuestionUnderstood:
      type: object
      additionalProperties: false
      properties:
        period:
          $ref: "#/components/schemas/QuestionAnswerPeriod"
        source:
          type: string
        inherited_from_turn_id:
          $ref: "#/components/schemas/OpaqueID"
        other_conditions:
          type: array
          items:
            type: string
    QuestionSearchedSource:
      type: object
      additionalProperties: false
      required: [source, result, message]
      properties:
        source:
          type: string
        result:
          type: string
          enum: [NOT_COVERED, NO_MATCHES, UNAVAILABLE]
        message:
          type: string
    WorkspaceModelContextDataLocation:
      type: object
      additionalProperties: false
      required: [source_connection_id, relation]
      properties:
        source_connection_id:
          $ref: "#/components/schemas/OpaqueID"
        relation:
          type: string
          minLength: 1
          maxLength: 256
        column:
          type: string
          maxLength: 256
        hint:
          type: string
          maxLength: 200
    WorkspaceModelContextRule:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          description: "Server-assigned (rule_<ULID>). Empty on a new rule in a save request."
        text:
          type: string
          minLength: 1
          maxLength: 500
    WorkspaceModelContextTerm:
      type: object
      additionalProperties: false
      required: [id, term]
      properties:
        id:
          type: string
          description: "Server-assigned (term_<ULID>). Empty on a new term in a save request."
        term:
          type: string
          minLength: 1
          maxLength: 80
        synonyms:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 80
        definition:
          type: string
          maxLength: 1000
        data_locations:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/WorkspaceModelContextDataLocation"
    WorkspaceModelContextColumn:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        note:
          type: string
          maxLength: 500
    WorkspaceModelContextTable:
      type: object
      additionalProperties: false
      required: [relation]
      properties:
        relation:
          type: string
          minLength: 1
          maxLength: 256
        note:
          type: string
          maxLength: 1000
        columns:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceModelContextColumn"
    WorkspaceModelContextSource:
      type: object
      additionalProperties: false
      required: [source_connection_id]
      properties:
        source_connection_id:
          $ref: "#/components/schemas/OpaqueID"
        description:
          type: string
          maxLength: 2000
        tables:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceModelContextTable"
    WorkspaceModelContextDocument:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          maxLength: 4000
        rules:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/WorkspaceModelContextRule"
        glossary:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/WorkspaceModelContextTerm"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceModelContextSource"
    WorkspaceModelContext:
      type: object
      additionalProperties: false
      required: [version, content_hash, editable, document, updated_at, updated_by]
      properties:
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: "0 means the workspace has no saved context yet; document is then empty."
        content_hash:
          type: string
          pattern: '^sha256:(empty|[0-9a-f]{64})$'
        editable:
          type: boolean
          description: "True only for a caller currently holding OWNER or MANAGER. Always false on a historical version read."
        document:
          $ref: "#/components/schemas/WorkspaceModelContextDocument"
        updated_at:
          type: string
          description: "RFC 3339 timestamp of this version, or empty string at version 0."
        updated_by:
          type: string
          description: "Principal id that created this version, or empty string at version 0."
    WorkspaceModelContextSaveRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          $ref: "#/components/schemas/WorkspaceModelContextDocument"
    WorkspaceModelContextVersionSummary:
      type: object
      additionalProperties: false
      required: [version, content_hash, change_kind, created_at, created_by]
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        change_kind:
          type: string
          enum: [EDIT, PROPOSAL_ACCEPTED, RESTORE]
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: "#/components/schemas/OpaqueID"
        proposal_id:
          type: string
          description: "Present only when change_kind is PROPOSAL_ACCEPTED."
    WorkspaceModelContextVersionList:
      type: object
      additionalProperties: false
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceModelContextVersionSummary"
        next_cursor:
          type: string
          description: "Pass as ?cursor= to continue. Absent on the last page."
    WorkspaceContextProposalExample:
      type: object
      additionalProperties: false
      required: [conversation_id, question_excerpt]
      properties:
        conversation_id:
          $ref: "#/components/schemas/OpaqueID"
        question_excerpt:
          type: string
          maxLength: 300
    WorkspaceContextProposal:
      type: object
      additionalProperties: false
      required:
        - proposal_id
        - kind
        - candidate_term
        - target_term_id
        - target_term
        - suggested_text
        - status
        - occurrences
        - created_at
        - examples
        - hidden_examples
      properties:
        proposal_id:
          type: string
        kind:
          type: string
          enum: [NEW_TERM, SYNONYM, DEFINITION_CORRECTION]
        candidate_term:
          type: string
          maxLength: 80
        target_term_id:
          type: string
          description: "Empty for a NEW_TERM proposal, which names no existing term."
        target_term:
          type: string
          description: "Current display name of target_term_id, resolved server-side; empty when target_term_id is empty."
        suggested_text:
          type: string
          maxLength: 300
        status:
          type: string
          enum: [PROPOSED, ACCEPTED, REJECTED, WITHDRAWN]
        occurrences:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        examples:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/WorkspaceContextProposalExample"
        hidden_examples:
          type: integer
          minimum: 0
          description: "Count of this proposal's evidence rows not resolvable into an example for the current viewer."
    WorkspaceContextProposalList:
      type: object
      additionalProperties: false
      required: [proposals]
      properties:
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceContextProposal"
        next_cursor:
          type: string
          description: "Pass as ?cursor= to continue. Absent on the last page."
    WorkspaceContextProposalAcceptRequest:
      type: object
      additionalProperties: false
      properties:
        term:
          type: string
          maxLength: 80
        synonyms:
          type: array
          items:
            type: string
            maxLength: 80
        definition:
          type: string
          maxLength: 1000
    WorkspaceContextProposalRejectResponse:
      type: object
      additionalProperties: false
      required: [proposal_id, status]
      properties:
        proposal_id:
          type: string
        status:
          type: string
          enum: [REJECTED]
    WorkspaceContextToolRequest:
      type: object
      additionalProperties: false
      properties:
        terms:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 80
        section:
          type: string
          enum: [all, glossary, rules, sources]
    WorkspaceContextToolResponse:
      type: object
      additionalProperties: false
      required: [version, content_hash, description, rules, glossary, sources, notice]
      properties:
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        content_hash:
          type: string
          pattern: '^sha256:(empty|[0-9a-f]{64})$'
        description:
          type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceModelContextRule"
        glossary:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceModelContextTerm"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceModelContextSource"
        notice:
          type: string
          enum: ["context, not evidence"]
    SourceSchemaToolRequest:
      type: object
      additionalProperties: false
      properties:
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        table:
          type: string
          maxLength: 257
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}\.[A-Za-z_][A-Za-z0-9_]{0,127}$'
        offset:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limit:
          type: integer
          minimum: 1
          maximum: 50
    SourceSchemaToolResponse:
      type: object
      additionalProperties: false
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceSchemaToolSource"
        source_id:
          type: string
        database_identity:
          type: string
        context_version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        source_note:
          type: string
        tables:
          type: array
          items:
            $ref: "#/components/schemas/SourceSchemaToolTable"
        next_offset:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        has_more:
          type: boolean
    SourceSchemaToolSource:
      type: object
      additionalProperties: false
      required: [id, name, table_count]
      properties:
        id:
          type: string
        name:
          type: string
        table_count:
          type: integer
          minimum: 0
    SourceSchemaToolTable:
      type: object
      additionalProperties: false
      required: [schema, name, kind, row_estimate, note, columns]
      properties:
        schema:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [TABLE, PARTITIONED_TABLE, VIEW, MATERIALIZED_VIEW]
        row_estimate:
          type: integer
          minimum: -1
          maximum: 9007199254740991
        note:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SourceSchemaToolColumn"
    SourceSchemaToolColumn:
      type: object
      additionalProperties: false
      required: [name, type, nullable, primary_key, note]
      properties:
        name:
          type: string
        type:
          type: string
        nullable:
          type: boolean
        primary_key:
          type: boolean
        note:
          type: string
    SourceSQLToolRequest:
      type: object
      additionalProperties: false
      required: [source_id, sql]
      properties:
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        sql:
          type: string
          minLength: 1
          maxLength: 8192
        purpose:
          type: string
          maxLength: 200
    SourceSQLToolResponse:
      type: object
      additionalProperties: false
      required: [format, columns, rows, row_count, attempt_id, sql_hash, result_digest, database_identity, execution_started_at, execution_completed_at, complete]
      properties:
        format:
          type: string
          enum: [postgres-text-table-v1]
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: [string, "null"]
        row_count:
          type: integer
          minimum: 0
        attempt_id:
          type: string
        sql_hash:
          type: string
        result_digest:
          type: string
        database_identity:
          type: string
        execution_started_at:
          type: string
        execution_completed_at:
          type: string
        complete:
          type: boolean
    SourceSQLToolRefusal:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - SQL_REJECTED_STATIC
            - RELATION_NOT_IN_SOURCE
            - COST_LIMIT
            - ROW_LIMIT
            - TIMEOUT
            - DATABASE_REJECTED
            - SOURCE_SQL_NOT_CONFIGURED
            - SOURCE_SQL_CONCURRENCY_LIMITED
            - SOURCE_SQL_RATE_LIMITED
  responses:
    CSRFResponse:
      description: Derived CSRF proof.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CSRFTokenResponse"
    WorkspaceResponse:
      description: Exact returned current or idempotently replayed workspace snapshot.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Workspace"
    WorkspaceListResponse:
      description: Workspaces visible to the authenticated principal.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkspaceList"
    RequestInvalid:
      description: >-
        Malformed path, header, body, JSON, unsupported query, or missing
        required JSON member. FIX-7 #2: the response body's error.fields
        names the exact rejected field(s) (never their values), and the
        server logs one matching WARN (request_id, route, code, the same
        field names) so a request_id from a client is enough to diagnose the
        rejection from the server's own logs.
      $ref: "#/components/responses/ErrorResponse"
    Unauthenticated:
      description: Missing, invalid, expired, revoked, or tenant-mismatched session.
      $ref: "#/components/responses/ErrorResponse"
    CSRFRejected:
      description: Missing or invalid exact Origin / CSRF proof for unsafe operation.
      $ref: "#/components/responses/ErrorResponse"
    CreateForbiddenOrCSRFRejected:
      description: CSRF validation failed or create operation was denied.
      $ref: "#/components/responses/ErrorResponse"
    Forbidden:
      description: Caller is a readable workspace member but not a current OWNER or MANAGER.
      $ref: "#/components/responses/ErrorResponse"
    NotFound:
      description: Route absent, malformed canonical resource path, or resource unavailable to this access context.
      $ref: "#/components/responses/ErrorResponse"
    IdempotencyConflict:
      description: Idempotency-Key was previously used by this actor for a different command body.
      $ref: "#/components/responses/ErrorResponse"
    RevisionConflict:
      description: If-Match was syntactically valid but no longer equals current workspace configuration.
      $ref: "#/components/responses/ErrorResponse"
    PreconditionRequired:
      description: Mutation requires If-Match but it was absent.
      $ref: "#/components/responses/ErrorResponse"
    PayloadTooLarge:
      description: Body exceeds 32768 bytes.
      $ref: "#/components/responses/ErrorResponse"
    UnsupportedMediaType:
      description: JSON body route requires application/json; valid media-type parameters are allowed.
      $ref: "#/components/responses/ErrorResponse"
    ServiceUnavailable:
      description: Internal dependency failure; no implementation detail is disclosed.
      $ref: "#/components/responses/ErrorResponse"
    ErrorResponse:
      description: Content-free error response.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SourceRegisterResponse:
      description: Idempotent registration projection; created=false on an exact replay.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SourceRegisterResult"
    SourceActivateResponse:
      description: Durable job id of the placed SOURCE_SCOPE_SYNC work.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SourceActivateResult"
    SourceListResponse:
      description: Current sync status of every source bound to the current workspace revision.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SourceList"
    SourceConnectionDraftListResponse:
      description: The unfinished PostgreSQL connections this workspace started, with their derived state.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SourceConnectionDraftList"
    QuestionRunResponse:
      description: Immutable extractive Question Run projection with current-access-checked citations.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QuestionRun"
    ConversationResponse:
      description: Current-access-checked conversation metadata and linked Question Runs.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Conversation"
    ConversationListResponse:
      description: Conversations visible to the authenticated principal in one workspace.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConversationList"
    ConversationIdempotencyConflict:
      description: Idempotency-Key was previously used by this actor for a different conversation archive command.
      $ref: "#/components/responses/ErrorResponse"
    QuestionIdempotencyConflict:
      description: Idempotency-Key was previously used by this actor for a different question.
      $ref: "#/components/responses/ErrorResponse"
    SourceConflict:
      description: The derived lineage already exists with a different configuration.
      $ref: "#/components/responses/ErrorResponse"
    SourceUnavailable:
      description: No verified FOLDER capability profile is provisioned yet.
      $ref: "#/components/responses/ErrorResponse"
    GovernedQueryUnavailable:
      description: Governed query is unavailable for this connection - one opaque code for a disabled flag, a missing exposed schema and an unreachable dedicated role (ADR-0089 section 6).
      $ref: "#/components/responses/ErrorResponse"
    GovernedQueryFailed:
      description: The model could not compose a statement the exposed schema and the read-only role accept, or its execution was refused by the bounds.
      $ref: "#/components/responses/ErrorResponse"
