        versions_created:
          type: integer
          minimum: 0
          nullable: true
        evidence_published:
          type: integer
          minimum: 0
          nullable: true
        quarantined:
          type: integer
          minimum: 0
          nullable: true
        job_id:
          $ref: "#/components/schemas/OpaqueID"
