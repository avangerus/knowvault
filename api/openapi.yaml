    PostgreSQLQuerySourceRegisterInput:
      type: object
      additionalProperties: false
      required: [source_type, name, kind, database_identity, lineage_id, projection_revision, contract_hash, schema_name, relation_name, relation_kind, columns, empty_snapshot_policy]
      properties:
        source_type:
          type: string
          const: POSTGRESQL_QUERY
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
          minLength: 1
          maxLength: 64
        database_identity:
          type: string
          minLength: 1
          maxLength: 128
        credential_reference:
          type: string
          description: Opaque worker-mounted credential reference; secret bytes never enter the API.
          pattern: '^cred_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
        lineage_id:
          type: string
          minLength: 1
          maxLength: 128
        projection_revision:
          type: integer
          minimum: 1
        contract_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        schema_name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_$]{0,62}$'
        relation_name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_$]{0,62}$'
        relation_kind:
          type: string
          enum: [VIEW, MATERIALIZED_VIEW]
        columns:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [ordinal, name, type_fingerprint, logical_type, roles, max_bytes]
            properties:
              ordinal: {type: integer, minimum: 1}
              name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$]{0,62}$'}
              type_fingerprint: {type: string, minLength: 1, maxLength: 128}
              logical_type:
                type: string
                enum: [BOOL, INT, NUMERIC, UUID, DATE, TIMESTAMP, TIMESTAMPTZ, TEXT, JSON, JSONB]
              roles:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, enum: [IDENTITY, TITLE, VERSION_HINT, EVIDENCE, PERIOD, STATUS]}
              nullable: {type: boolean}
              precision: {type: integer, minimum: 0, maximum: 1000}
              scale: {type: integer, minimum: 0, maximum: 1000}
              max_bytes: {type: integer, minimum: 1, maximum: 67108864}
        empty_snapshot_policy:
          type: string
          enum: [HELD, AUTHORITATIVE]
        max_rows: {type: integer, minimum: 1, maximum: 10000000}
        max_columns: {type: integer, minimum: 1, maximum: 128}
        max_field_bytes: {type: integer, minimum: 1, maximum: 1048576}
        max_row_bytes: {type: integer, minimum: 1, maximum: 16777216}
        max_total_bytes: {type: integer, minimum: 1, maximum: 1073741824}
        statement_timeout_ms: {type: integer, minimum: 100, maximum: 300000}
        sync_interval_seconds: {type: integer, minimum: 60, maximum: 86400}
