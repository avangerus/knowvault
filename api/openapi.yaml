        evidence capabilities are composed. The governed SQL ask additionally requires workspace
        opt-in, an exposed connection and database grants; listing it does not qualify it as part of
        the prepared-snapshot pilot. Tool authorization remains in force, and administrative tools
        are unavailable. Another workspace returns the same response as a nonexistent workspace. The
        code is accepted only at the MCP endpoint. If-Match is not required. An exact issuance retry
        returns 409 SERVICE_PRINCIPAL_ALREADY_ISSUED without repeating the secret.
