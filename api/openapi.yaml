    Workspace:
      type: object
      additionalProperties: false
      required:
        [id, name, description, status, revision, owner_principal_id, retention_policy_id, members, processing_mode]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueID"
        name:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        owner_principal_id:
          $ref: "#/components/schemas/OpaqueID"
        retention_policy_id:
          type: string
          maxLength: 128
          pattern: '^(|[A-Za-z0-9_.:-]{3,128})$'
        members:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMember"
        processing_mode:
          description: >-
            Processing location of the default generation profile, not a
            per-request selection. INTERNAL_UNAVAILABLE when the default is
            unavailable in this workspace. A completed tool-loop answer may
            carry its actual selected model_profile separately.
          type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              type: string
              enum: [INTERNAL, EXTERNAL, INTERNAL_UNAVAILABLE]
            provider:
              type: string
              maxLength: 256
        model_profiles:
          description: >-
            Mounted tool-loop profiles available in this currently authorized
            workspace, filtered by the server's exact workspace allow-lists.
            Contains no endpoint, credential, or mount path. Empty when none
            is available; a caller cannot widen this catalogue with a profile ID.
          type: array
          items:
            $ref: "#/components/schemas/QuestionModelProfileOption"
    WorkspaceSummary:
      type: object
      additionalProperties: false
      required: [id, name, status, revision, role]
      properties:
        id:
          $ref: "#/components/schemas/OpaqueID"
        name:
          type: string
          minLength: 1
          maxLength: 256
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        degraded:
          type: boolean
        degraded_reason:
          type: string
          enum: [WORKSPACE_CONFIGURATION_HASH_STALE]
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, request_id]
          properties:
            code:
              type: string
              enum:
                [REQUEST_INVALID, UNAUTHENTICATED, CSRF_REJECTED, FORBIDDEN,
                 NOT_FOUND, METHOD_NOT_ALLOWED, PRECONDITION_REQUIRED,
                 WORKSPACE_REVISION_CONFLICT, WORKSPACE_IDEMPOTENCY_CONFLICT,
                 QUESTION_IDEMPOTENCY_CONFLICT, CONVERSATION_IDEMPOTENCY_CONFLICT,
                 SOURCE_CONFLICT, SOURCE_UNAVAILABLE,
                 PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, SERVICE_UNAVAILABLE]
            request_id:
              type: string
              maxLength: 128
            fields:
              description: >-
                FIX-7 #2: present only for a validation failure at this HTTP
                surface (typically code=REQUEST_INVALID, also
                PRECONDITION_REQUIRED/PAYLOAD_TOO_LARGE/UNSUPPORTED_MEDIA_TYPE):
                the exact request field or header NAMES that failed
                validation, never their values. The same rejection is also
                logged server-side as a WARN carrying request_id, the route
                and this same field list, so a request_id from a client is
                enough to find and understand the rejection in the server's
                own logs. Absent for every other error and for a validation
                failure not attributable to a named field (an unparseable
                body, an unsupported Content-Type).
              type: array
              items:
                type: string
                maxLength: 128
              maxItems: 32
            clarification:
              description: >-
                R2 Outcome 2 (KV-A02): present only when a typed QueryIntent
                refusal carries a server-owned clarification for a human. It is
                the closed-dictionary clarification text the server emits,
                never a client-supplied value; clients should show it to the
                user. Absent for every other error, so every pre-R2 error body
                keeps its exact shape.
              type: string
              maxLength: 2048
    RelativePath:
      type: string
      minLength: 1
      maxLength: 4096
