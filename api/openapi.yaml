        required: true
        description: >-
          R3a-1 KV-A03: lexical query over canonical workspace fragments. Required and nonempty;
          whitespace-only strings are rejected. Limited to 4096 characters. A duplicate, unknown
          key, or empty value returns REQUEST_INVALID before any read.
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: offset
        in: query
        required: false
        description: >-
          Zero-based result-page offset. Only an unsigned decimal int64 representation is accepted;
          signs, empty values, duplicates, unknown keys, and overflow return REQUEST_INVALID.
        schema:
          type: string
          pattern: "^[0-9]{1,19}$"
      - name: limit
        in: query
        required: false
        description: >-
          Page size in hits. 0, like omission, selects the default of 20. Requested values are
          capped at 100; the effective value is always returned as limit.
        schema:
          type: string
          pattern: "^[0-9]{1,19}$"
      - name: all_versions
        in: query
        required: false
        description: >-
          false (default) includes only each object's current version; true includes every version
          of every workspace object.
        schema:
          type: string
          enum: ["true", "false"]
    get:
      operationId: searchWorkspaceToolDocuments
      tags: [Search]
      summary: "Keyword and semantic search over workspace documents (REST parity with knowvault_search)"
      description: >-
        R3a-1 KV-A03 + S3: REST parity with the knowvault_search MCP tool. Returns the same
        projection as MCP: hits with excerpt, score, channel, version_id, observed_at, content_hash,
        and an immutable address, plus an explicit offset/limit/has_more/next_offset page window. A
        limit never silently truncates the result.

        S3: search is hybrid. The lexical and vector channels each apply workspace,
        permission-bearing source-scope, and current-version-state filtering within the query before
        ranking. RRF fusion follows, and every surviving hit is then reauthorized against live
        state. A permission revoked after indexing therefore removes the hit regardless of which
        channel found it. A deployment without a vector channel returns the same lexical page and
        declares profile.degraded=true rather than presenting lexical retrieval as hybrid.

        The per-call search profile is not a tool argument: it arrives in the
        X-KnowVault-Search-Profile header, is accepted only from the workspace owner, is recorded in
        audit, and is returned as profile. The model does not choose the algorithm, which would
        otherwise make algorithm selection part of the answer.

        Dispatches through the same authorized Evidence viewer, preserving admission-before-data,
        audit, and content-free denial. An unknown workspace or a nonmember receives the same 404
        NOT_FOUND, without hits or an echo of the requested workspace.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      responses:
        "200":
          description: >-
            Explicit result page: results, offset, effective limit, has_more, and next_offset when
            another page exists. Also includes profile, the search profile actually used for this
            call, and terms alongside ordinary results when the workspace defines the queried term.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        channel:
                          type: string
                          description: >-
                            S3: the origin of a hit: lexical (matching words), vector (matching
                            meaning), hybrid (both), or term (a workspace term definition). This is
                            result provenance, not a parameter: channel is never accepted as input.
                          enum: [lexical, vector, hybrid, term]
                        version_state:
                          type: string
                          description: >-
                            Version state under which the hit was returned. Omitted when the result
                            path cannot establish it; never guessed.
                          enum: [CURRENT, SUPERSEDED]
                        score:
                          type: number
                          description: >-
                            Ranking score. Hybrid retrieval uses a fractional RRF score; a purely
                            lexical deployment uses an integer term frequency. Both are numbers.
                  profile:
                    type: object
                    description: >-
                      S3 section 7.5: the search profile actually used for the call (mode, lexical,
                      vector, fusion, k, reranker, degraded, embedding_profile). It is not a tool
                      argument; the model does not choose the algorithm. degraded=true means a
                      declared channel did not respond, so a nominally hybrid result that was
                      actually lexical is not presented as hybrid.
                  terms:
                    type: array
                    description: >-
                      S3 section 4.1: workspace term definitions matching the query text, returned
                      as separately addressable hits alongside ordinary results, never instead of
                      them. A homonym produces two hits; the product does not choose between them.
                      This member is omitted when the workspace catalog defines nothing.
                    items:
                      type: object
                  terms_truncated:
                    type: boolean
                  partial:
                    type: boolean
                    description: >-
                      Ranking candidates are not fully covered, or the page size is constrained by
                      the evidence-read budget. has_more and next_offset indicate continuation
                      within the discovered candidate set; partial=true does not imply that no other
                      workspace data exists.
                  offset:
                    type: integer
                    format: int64
                  limit:
                    type: integer
                    format: int64
                  has_more:
                    type: boolean
                  next_offset:
                    type: integer
                    format: int64
                    nullable: true
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: searchWorkspaceToolDocumentsPost
      tags: [Search]
      summary: "Lexical search over workspace documents (POST parity)"
      description: >-
        The same REST parity with knowvault_search as GET: query/offset/limit/all_versions are query
        parameters, and the request body is not read. POST supports clients that call knowledge
        tools using POST; projection, authorization, audit, and denial are identical to GET.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      responses:
        "200":
          description: "The same explicit result page as GET."
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

