  /workspaces/{workspace_id}/tools/read:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: fragment_id
        in: query
        required: false
        description: >-
          R3a-1: identifier of the addressed fragment (citation object) read in explicit pages.
          Required unless address is supplied; limited to 128 characters. Duplicates, empty values,
          and unknown keys return REQUEST_INVALID before any read.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: address
        in: query
        required: false
        description: >-
          Canonical compact internal/address value (kv1:<object>:<version>:<span>:<hash16>). Parsed
          with address.Parse. When fragment_id is absent, it selects the object; when both are
          present, they must identify the same object. An unparseable address, object mismatch with
          fragment_id, or source/version mismatch returns REQUEST_INVALID before invoking the
          capability. A keyed span-digest mismatch returns 409 EVIDENCE_SPAN_HASH_MISMATCH without
          page bytes.
        schema:
          type: string
          minLength: 1
      - name: offset
        in: query
        required: false
        description: >-
          Page offset in UTF-8 bytes of the fragment's canonical text, default 0. A nondecimal
          value, sign, or offset beyond the end of the text returns REQUEST_INVALID. In cursor mode,
          a nonzero offset is incompatible with cursor.
        schema:
          type: string
          pattern: "^[0-9]{1,19}$"
      - name: limit
        in: query
        required: false
        description: >-
          Page size in bytes. 0, like omission, means 4096. Requested values are capped at 65536;
          the effective value is always returned as limit.
        schema:
          type: string
          pattern: "^[0-9]{1,19}$"
      - name: expected_span_hash
        in: query
        required: false
        description: >-
          Expected keyed text_hash of the entire fragment. A mismatch returns the typed content-free
          error 409 EVIDENCE_SPAN_HASH_MISMATCH without page text or an address, detecting a
          substituted index.
        schema:
          type: string
          minLength: 1
      - name: cursor
        in: query
        required: false
        description: >-
          Stable whole-object page cursor in v1:<offset> form. Supplying cursor switches reading to
          pages of the version's entire source text; request the first page with cursor=v1:0, then
          use the preceding page's next_cursor. Another form, an empty value, a cursor beyond the
          end of the original, or combination with a nonzero offset returns REQUEST_INVALID.
        schema:
          type: string
          pattern: "^v1:[0-9]{1,19}$"
    get:
      operationId: readWorkspaceToolEvidence
      tags: [Search]
      summary: "Explicit fragment or whole-object pages within a workspace (REST parity with knowvault_read)"
      description: >-
        R3a-1 Outcome 1: REST parity with the knowvault_read MCP tool. Returns the same projection
        as MCP. Fragment mode returns fragment_id, text, text_base64, offset, length, next_offset,
        has_more, effective limit, total_length, text_hash, page_hash, immutable address and
        canonical_address, and optional neighbors containing immediate-neighbor addresses for a
        complete direct fragment page starting at offset=0. Whole-object mode returns offset,
        length, next_cursor, has_more, complete, effective limit, total_bytes, whole_hash,
        page_hash, address, canonical_address, fragment_count, ordinal_start, and ordinal_end.
        Concatenating decoded text_base64 from all pages reproduces the retained text assembly
        hashed by whole_hash; a limit never silently truncates it. Dispatches through the same
        authorized Evidence.Read and EvidenceWholeObject/address.Read capabilities as MCP,
        preserving admission-before-data, audit, and content-free denial. An unknown workspace or a
        nonmember receives the same 404 NOT_FOUND without text or an echo of the requested
        workspace. With address, a separate exact read permits a retained superseded version and its
        immutable extraction; fragment_id without address continues to read only current data.
        Current permissions and version/extraction retention are checked on every call.
        is_current_version indicates version currency; source_page_url opens the authorized fragment
        in KnowVault at its exact address. In whole-object mode, the page link identifies the anchor
        fragment. text_representation distinguishes exact canonical text from the newer extraction
        layout (CANONICAL_TEXT_V1_LAYOUT_V2) from legacy fragment concatenation
        (LEGACY_FRAGMENT_CONCAT_V1), for which preservation of original line breaks is unproven. The
        hash always covers the bytes actually returned.
      x-implementation-status: LIVE
      security:
        - SessionCookie: []
      responses:
        "200":
          description: >-
            Explicit page: text, text_base64, offset, length, next_offset or next_cursor, has_more,
            effective limit, and hashes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fragment_id:
                    type: string
                  text:
                    type: string
                  text_base64:
                    type: string
                  offset:
                    type: integer
                    format: int64
                  length:
                    type: integer
                    format: int64
                  next_offset:
                    type: integer
                    format: int64
                    nullable: true
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
                  complete:
                    type: boolean
                  limit:
                    type: integer
                    format: int64
                  total_length:
                    type: integer
                    format: int64
                  total_bytes:
                    type: integer
                    format: int64
                  text_hash:
                    type: string
                  whole_hash:
                    type: string
                  text_representation:
                    type: string
                    enum: [LEGACY_FRAGMENT_CONCAT_V1, CANONICAL_TEXT_V1_LAYOUT_V2, CANONICAL_STRUCTURAL_TEXT_V1]
                    description: Present in whole-object mode. TEXT layout-v2 preserves the canonical text stream; structural-text-v1 preserves the native parser's canonical object text and LF separators between its units. Legacy concatenation has no complete-text fidelity proof. None denotes the original binary file.
                  page_hash:
                    type: string
                  address:
                    type: object
                  canonical_address:
                    type: string
                  neighbors:
                    type: object
                    description: >-
                      Only for a complete direct fragment page (offset=0, has_more=false). Contains
                      at most the preceding and following fragments of the same active extraction,
                      without their text.
                    properties:
                      previous:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/EvidenceFragmentNeighbor"
                      next:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/EvidenceFragmentNeighbor"
                  source_path:
                    type: string
                    description: Authorized external source identity, such as a relative file path; absent or empty for legacy objects without that artifact.
                  fragment_count:
                    type: integer
                  fragments:
                    type: array
                    description: Fragment addresses intersecting this page; byte windows are relative to its text.
                    items:
                      type: object
                      required: [canonical_address, fragment_id, page_offset, length]
                      properties:
                        canonical_address:
                          type: string
                        fragment_id:
                          type: string
                        page_offset:
                          type: integer
                        length:
                          type: integer
                  ordinal_start:
                    type: integer
                  ordinal_end:
                    type: integer
        "400":
          $ref: "#/components/responses/RequestInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
